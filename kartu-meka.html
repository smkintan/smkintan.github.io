<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pembuat Kartu Pelajar Mekatronika</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ==================================================
PENGATURAN DASAR
================================================== */

*{
box-sizing:border-box;
}

body{
margin:0;

font-family:Arial,sans-serif;

color:#222;

min-height:100vh;

background:

radial-gradient(
circle at 10% 10%,
rgba(255,49,49,.25),
transparent 25%
),

radial-gradient(
circle at 90% 90%,
rgba(255,0,0,.20),
transparent 30%
),

linear-gradient(
135deg,
#090909,
#330000 45%,
#700000 100%
);

background-attachment:fixed;
}


/* EFEK CAHAYA HALUS
GARIS DIHILANGKAN */

body:before{

content:"";

position:fixed;

inset:0;

pointer-events:none;

background:

radial-gradient(
circle at 20% 20%,
rgba(255,255,255,.06),
transparent 30%
),

radial-gradient(
circle at 80% 75%,
rgba(255,0,0,.10),
transparent 35%
);

}


/* ==================================================
HEADER
================================================== */

header{

position:relative;

overflow:hidden;

background:

linear-gradient(
135deg,
#170000,
#9e0000 55%,
#280000
);

color:white;

text-align:center;

padding:25px;

border-bottom:

3px solid
rgba(255,255,255,.25);

box-shadow:

0 8px 25px
rgba(0,0,0,.60);

}


header:after{

content:
"⚙  ⚡  ◇  ⚙  ⚡";

position:absolute;

left:-5%;

right:-5%;

bottom:-20px;

font-size:70px;

letter-spacing:45px;

color:
rgba(255,255,255,.06);

white-space:nowrap;

transform:
rotate(-4deg);

}


header h1{

position:relative;

z-index:2;

margin:0;

font-size:28px;

}


header p{

position:relative;

z-index:2;

margin:

7px 0 0;

}


/* ==================================================
LAYOUT
================================================== */

.wrap{

max-width:1150px;

margin:auto;

padding:22px;

display:grid;

grid-template-columns:

380px 1fr;

gap:24px;

}


/* ==================================================
PANEL BIODATA
================================================== */

.panel{

background:

linear-gradient(
145deg,
#ffffff,
#eeeeee
);

border:

1px solid
rgba(255,255,255,.70);

border-radius:18px;

padding:22px;

box-shadow:

0 12px 35px
rgba(0,0,0,.50);

position:relative;

overflow:hidden;

}


.panel:before{

content:
"MEKATRONIKA";

position:absolute;

right:-45px;

top:30px;

transform:
rotate(35deg);

font-size:35px;

font-weight:bold;

color:
rgba(180,0,0,.04);

}


.panel h2{

position:relative;

margin-top:0;

padding-bottom:10px;

border-bottom:

4px solid
#b40000;

}


label{

display:block;

font-weight:bold;

margin-top:13px;

}


input{

width:100%;

padding:12px;

margin-top:6px;

border:

1px solid
#cccccc;

border-radius:9px;

font-size:16px;

outline:none;

}


input:focus{

border-color:
#b40000;

box-shadow:

0 0 0 3px
rgba(180,0,0,.10);

}


/* ==================================================
TOMBOL
================================================== */

button{

width:100%;

padding:14px;

border:0;

border-radius:10px;

margin-top:18px;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;

}


button:hover{

transform:

translateY(-2px);

box-shadow:

0 7px 18px
rgba(0,0,0,.35);

}


.btn-preview{

background:

linear-gradient(
135deg,
#750000,
#d60000,
#870000
);

color:white;

}


.btn-download{

background:

linear-gradient(
135deg,
#111111,
#333333
);

color:white;

}


/* ==================================================
PREVIEW
================================================== */

.preview{

position:CENTER;

background:

linear-gradient(
145deg,
rgba(255,255,255,.95),
rgba(204,204,204,.95)
);

border:

1px solid
rgba(255,255,255,.60);

border-radius:18px;

padding:22px;

box-shadow:

0 12px 35px
rgba(0,0,0,.60);

text-align:center;

overflow:auto;

}


.preview:before{

content:"";

position:absolute;

inset:10px;

border-radius:13px;

border:

1px solid
rgba(180,0,0,.20);

pointer-events:none;

}


/* ==================================================
KARTU
================================================== */

#card{

width:540px;

height:850px;

margin:auto;

position:relative;

overflow:hidden;

border-radius:28px;


/* GRADIEN BERSIH
TANPA GARIS BERULANG */

background:

radial-gradient(

circle at 85% 18%,

rgba(255,60,60,.32),

transparent 25%

),

radial-gradient(

circle at 10% 80%,

rgba(255,0,0,.22),

transparent 30%

),

linear-gradient(

125deg,

#090909 0%,

#1a1a1a 22%,

#870000 23%,

#d50000 44%,

#f2f2f2 45%,

#ffffff 100%

);


box-shadow:

0 18px 45px
rgba(0,0,0,.70),

inset

0 0 0 3px

rgba(255,255,255,.25);

}


/* ==================================================
EFEK CAHAYA KARTU
TANPA GARIS
================================================== */

#card:before{

content:"";

position:absolute;

inset:0;

pointer-events:none;

background:

radial-gradient(

circle at 15% 15%,

rgba(255,255,255,.12),

transparent 28%

),

radial-gradient(

circle at 88% 70%,

rgba(255,0,0,.14),

transparent 32%

),

linear-gradient(

135deg,

transparent 30%,

rgba(255,255,255,.05) 50%,

transparent 70%

);

opacity:.80;

}


/* ==================================================
RODA GIGI
================================================== */

#card:after{

content:"⚙";

position:absolute;

right:-65px;

top:160px;

font-size:300px;

font-weight:bold;

color:

rgba(255,255,255,.06);

transform:

rotate(18deg);

z-index:1;

}


/* ==================================================
EFEK TEKNOLOGI HALUS
================================================== */

.circuit{

position:absolute;

inset:0;

z-index:2;

pointer-events:none;

background:

radial-gradient(

circle at 8% 35%,

rgba(255,255,255,.40)

0 4px,

transparent 5px

),

radial-gradient(

circle at 92% 55%,

rgba(255,255,255,.28)

0 4px,

transparent 5px

),

radial-gradient(

circle at 78% 22%,

rgba(255,0,0,.25)

0 5px,

transparent 6px

);

opacity:.60;

}


/* ==================================================
BAGIAN ATAS KARTU
================================================== */

.top{

position:relative;

z-index:5;

color:white;

padding:

28px 25px 20px;

text-align:center;

background:

linear-gradient(

135deg,

rgba(8,8,8,.92),

rgba(112,0,0,.82) 50%,

rgba(208,0,0,.82)

);

clip-path:

polygon(

0 0,

100% 0,

100% 88%,

88% 100%,

0 92%

);

}


/* ==================================================
LOGO
================================================== */

.logo{

width:105px;

height:105px;

margin:auto;

padding:5px;

display:flex;

align-items:center;

justify-content:center;

background:white;

border:

2px solid white;

border-radius:50%;

overflow:hidden;

box-shadow:

0 0 20px
rgba(255,68,68,.70),

0 8px 18px
rgba(0,0,0,.50);

}


.logo img{

width:100%;

height:100%;

display:block;

object-fit:contain;

border-radius:50%;

background:white;

}


/* ==================================================
TEKS SEKOLAH
================================================== */

.school{

font-size:23px;

font-weight:900;

margin-top:10px;

line-height:1.1;

color:white;

}


.dept{

font-size:39px;

font-weight:900;

letter-spacing:1px;

margin-top:18px;

color:white;

text-shadow:

2px 3px 2px
#400000,

0 0 15px
rgba(255,68,68,.70);

}


.sub{

font-size:15px;

font-weight:bold;

margin-top:-14px;

letter-spacing:1px;

color:white;

}


/* ==================================================
BAGIAN DATA
================================================== */

.body{

position:absolute;

z-index:6;

top:270px;

left:0;

right:0;

bottom:0;

padding:25px;

background:

linear-gradient(

135deg,

rgba(255,255,255,.94),

rgba(238,238,238,.94) 55%,

rgba(255,255,255,.96)

);

clip-path:

polygon(

0 3%,

100% 0,

100% 100%,

0 100%

);

}


/* ==================================================
FOTO
================================================== */

.photo{

width:235px;

height:285px;

background:

linear-gradient(

135deg,

#eeeeee,

#bbbbbb

);

border:

6px solid
#b90000;

border-radius:18px;

margin:auto;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

color:#666;

font-weight:bold;

box-shadow:

0 8px 20px
rgba(0,0,0,.30),

0 0 0 5px
white;

}


.photo img{

width:100%;

height:100%;

display:block;

object-fit:cover;

object-position:center;

}


/* ==================================================
DATA SISWA
================================================== */

.fields{

margin-top:22px;

background:

linear-gradient(

135deg,

white,

#eeeeee

);

border-radius:15px;

padding:14px 20px;

border-left:

7px solid
#b40000;

box-shadow:

0 5px 15px
rgba(0,0,0,.20);

}


.row{

display:flex;

border-bottom:

1px solid
#d4d4d4;

padding:11px 0;

font-size:17px;

text-align:left;

}


.row:last-child{

border:0;

}


.k{

width:145px;

font-weight:900;

color:#000000;

}


.v{

font-weight:bold;

color:#000000;

word-break:break-word;

}


/* ==================================================
FOOTER
================================================== */

.footer{

position:absolute;

z-index:10;

bottom:0;

left:0;

right:0;

background:

linear-gradient(

90deg,

#3d0000,

#b40000,

#4d0000

);

color:white;

padding:16px;

font-weight:bold;

font-size:17px;

letter-spacing:1px;

box-shadow:

0 -5px 15px
rgba(0,0,0,.25);

}


/* ==================================================
RESPONSIVE HP
================================================== */

@media(max-width:900px){

.wrap{

grid-template-columns:

1fr;

}


.preview{

padding:8px;

}


#card{

transform:

scale(.62);

transform-origin:

top center;

margin-bottom:

-320px;

}

}

</style>

</head>

<body>


<header>

<h1>

PEMBUATAN KARTU PELAJAR

</h1>

<p>

Jurusan Teknik Mekatronika

</p>

</header>


<div class="wrap">


<!-- PANEL INPUT -->

<div class="panel">


<h2>

Isi Biodata

</h2>


<label>

Nama Lengkap

</label>


<input

id="nama"

type="text"

placeholder="Masukkan nama"

>


<label>

NIS

</label>


<input

id="nis"

type="text"

placeholder="Masukkan NIS"

>


<label>

Upload Foto

</label>


<input

id="foto"

type="file"

accept="image/*"

>


<button

class="btn-preview"

onclick="updateCard()"

>

TAMPILKAN KARTU

</button>


<button

id="downloadButton"

class="btn-download"

onclick="downloadCard()"

>

DOWNLOAD PNG

</button>


<p

style="

font-size:13px;

color:#666;

line-height:1.5;

"

>

Data hanya diproses di perangkat dan tidak disimpan ke server.

</p>


</div>


<!-- PREVIEW -->

<div class="preview">


<div id="card">


<div class="circuit"></div>


<!-- BAGIAN ATAS -->

<div class="top">


<div class="logo">

<img

src="https://smkintan.github.io/foto/Untitled.png"

alt="Logo Mekatronika"

crossorigin="anonymous"

>

</div>


<div class="school">

SMK NEGERI 1

<br>

INDRALAYA SELATAN

</div>


<div class="dept">

MEKATRONIKA

</div>


<div class="sub">

MEKANIK • ELEKTRONIK • INFORMATIKA

</div>


</div>


<!-- BAGIAN DATA -->

<div class="body">


<div

class="photo"

id="photoBox"

>

FOTO SISWA

</div>


<div class="fields">


<div class="row">


<div class="k">

NAMA

</div>


<div

class="v"

id="oNama"

>

-

</div>


</div>


<div class="row">


<div class="k">

NIS

</div>


<div

class="v"

id="oNis"

>

-

</div>


</div>


<div class="row">


<div class="k">

JURUSAN

</div>


<div

class="v"

id="oJurusan"

>

TEKNIK MEKATRONIKA

</div>


</div>


</div>


</div>


<div class="footer">

KREATIF • INOVATIF • BERDAYA SAING

</div>


</div>


</div>


</div>


<script>


/* ==================================================
UPDATE DATA
================================================== */

function updateCard(){

const nama =

document

.getElementById("nama")

.value

.trim();


const nis =

document

.getElementById("nis")

.value

.trim();


document

.getElementById("oNama")

.textContent =

nama

?

nama.toUpperCase()

:

"-";


document

.getElementById("oNis")

.textContent =

nis

?

nis

:

"-";

}


/* ==================================================
UPLOAD FOTO
================================================== */

document

.getElementById("foto")

.addEventListener(

"change",

function(event){


const file =

event.target.files[0];


if(!file){

return;

}


const reader =

new FileReader();


reader.onload =

function(e){


const photoBox =

document

.getElementById(

"photoBox"

);


photoBox.innerHTML =

"";


const image =

document

.createElement(

"img"

);


image.src =

e.target.result;


image.alt =

"Foto Siswa";


photoBox.appendChild(

image

);


};


reader.readAsDataURL(

file

);


}

);


/* ==================================================
DOWNLOAD PNG
================================================== */

async function downloadCard(){

const tombol =

document

.getElementById(

"downloadButton"

);


const teksAwal =

tombol.innerHTML;


try{


updateCard();


tombol.innerHTML =

"⏳ MEMPROSES KARTU...";


tombol.disabled =

true;


const card =

document

.getElementById(

"card"

);


await new Promise(

function(resolve){

setTimeout(

resolve,

500

);

}

);


const canvas =

await html2canvas(

card,

{

scale:2,

backgroundColor:

"#ffffff",

useCORS:true,

allowTaint:true,

logging:false,

imageTimeout:20000

}

);


const nama =

document

.getElementById(

"nama"

)

.value

.trim()

||

"MEKATRONIKA";


const namaFile =

nama

.replace(

/[^a-zA-Z0-9]/g,

"_"

)

.toUpperCase();


const link =

document

.createElement(

"a"

);


link.download =

"KARTU_PELAJAR_"

+

namaFile

+

".png";


link.href =

canvas.toDataURL(

"image/png"

);


document

.body

.appendChild(

link

);


link.click();


document

.body

.removeChild(

link

);


}

catch(error){


console.error(

error

);


alert(

"Gagal membuat kartu. Silakan coba kembali."

);


}

finally{


tombol.innerHTML =

teksAwal;


tombol.disabled =

false;


}

}


</script>

</body>

</html>
