<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembuat Kartu Pelajar Mekatronika</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
color:#222;
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,#ff313155 0 2%,transparent 22%),
radial-gradient(circle at 90% 90%,#ff000044 0 3%,transparent 25%),
linear-gradient(135deg,#090909,#330000 45%,#700000 100%);
background-attachment:fixed;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.16;
background-image:
linear-gradient(30deg,transparent 49%,#fff 50%,transparent 51%),
linear-gradient(150deg,transparent 49%,#fff 50%,transparent 51%);
background-size:90px 150px;
}

header{
position:relative;
overflow:hidden;
background:
linear-gradient(135deg,#170000,#9e0000 55%,#280000);
color:#fff;
text-align:center;
padding:25px;
border-bottom:3px solid #ffffff55;
box-shadow:0 8px 25px #0009;
}

header:after{
content:"⚙  ⚡  ◇  ⚙  ⚡";
position:absolute;
left:-5%;
right:-5%;
bottom:-20px;
font-size:70px;
letter-spacing:45px;
color:#ffffff10;
white-space:nowrap;
transform:rotate(-4deg);
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:7px 0 0;
}

.wrap{
max-width:1150px;
margin:auto;
padding:22px;
display:grid;
grid-template-columns:380px 1fr;
gap:24px;
}

.panel{
background:linear-gradient(145deg,#fff,#eeeeee);
border:1px solid #ffffffaa;
border-radius:18px;
padding:22px;
box-shadow:0 12px 35px #0008;
position:relative;
overflow:hidden;
}

.panel:before{
content:"MEKATRONIKA";
position:absolute;
right:-45px;
top:30px;
transform:rotate(35deg);
font-size:35px;
font-weight:bold;
color:#b4000008;
}

label{
display:block;
font-weight:bold;
margin-top:13px;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:9px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
margin-top:18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.preview{
background:
linear-gradient(145deg,#ffffffee,#cccccc);
border:1px solid #ffffff99;
border-radius:18px;
padding:22px;
box-shadow:0 12px 35px #0009;
text-align:center;
overflow:auto;
position:relative;
}

.preview:before{
content:"";
position:absolute;
inset:10px;
border-radius:13px;
border:1px solid #b4000033;
pointer-events:none;
}

/* =========================
BACKGROUND KARTU BARU
========================= */

#card{
width:540px;
height:850px;
margin:auto;
position:relative;
overflow:hidden;
border-radius:28px;

background:
radial-gradient(circle at 82% 18%,#ff303055 0 5%,transparent 22%),
radial-gradient(circle at 8% 82%,#ff000044 0 7%,transparent 26%),

linear-gradient(
125deg,
#0a0a0a 0%,
#181818 22%,
#8f0000 23%,
#d60000 44%,
#f5f5f5 45%,
#ffffff 100%
);

box-shadow:
0 18px 45px #0009,
inset 0 0 0 3px #ffffff55;
}

/* GARIS TEKNOLOGI */

#card:before{
content:"";
position:absolute;
inset:0;

background:

linear-gradient(
90deg,
transparent 0 7%,
#ffffff33 7.3% 7.8%,
transparent 8.2%
),

linear-gradient(
0deg,
transparent 0 25%,
#ff000033 25.4% 25.8%,
transparent 26.2%
),

repeating-linear-gradient(
135deg,
transparent 0 42px,
#ffffff12 43px 46px
),

repeating-linear-gradient(
45deg,
transparent 0 70px,
#9900000d 71px 74px
);

background-size:
105px 100px,
150px 130px,
80px 80px,
100px 100px;

opacity:.9;
}

/* RODA GIGI */

#card:after{
content:"⚙";
position:absolute;
right:-65px;
top:160px;

font-size:300px;
font-weight:bold;

color:#ffffff13;

transform:rotate(18deg);

z-index:1;
}

/* CIRCUIT */

.circuit{
position:absolute;
inset:0;
z-index:2;
pointer-events:none;

background:

linear-gradient(
90deg,
transparent 0 14%,
#ffffff66 14.2% 14.8%,
transparent 15%
),

linear-gradient(
90deg,
transparent 0 82%,
#ff000044 82.2% 82.8%,
transparent 83%
),

linear-gradient(
0deg,
transparent 0 64%,
#ffffff44 64.2% 64.8%,
transparent 65%
);

background-size:
130px 100px,
170px 130px,
140px 110px;

opacity:.65;
}

/* BAGIAN ATAS */

.top{
position:relative;
z-index:5;
color:#fff;
padding:28px 25px 20px;
text-align:center;

background:

linear-gradient(
135deg,
#080808cc,
#700000aa 50%,
#d00000aa
);

clip-path:
polygon(
0 0,
100% 0,
100% 88%,
88% 100%,
0 92%
);
}

.logo{
width:105px;
height:105px;
margin:auto;
padding:5px;

display:flex;
align-items:center;
justify-content:center;

background:#ffffff;

border:1px solid #ffffff;

border-radius:50%;

overflow:hidden;

box-shadow:
0 0 20px #ff4444,
0 8px 18px #0008;
}

.logo img{
width:100%;
height:100%;

display:block;

object-fit:contain;

border-radius:50%;

background:#ffffff;
}


box-shadow:

0 0 18px #ff5555,

0 6px 15px #0008;
}

.school{
font-size:23px;
font-weight:900;
margin-top:10px;
line-height:1.1;
}

.dept{
font-size:39px;
font-weight:900;
letter-spacing:1px;
margin-top:18px;

text-shadow:

2px 3px 2px #400000,

0 0 15px #ff4444;
}

.sub{
font-size:15px;
font-weight:bold;
margin-top:6px;
letter-spacing:1px;

}

/* BAGIAN DATA */

.body{
position:absolute;

z-index:6;

top:270px;

left:0;

right:0;

bottom:0;

padding:25px;

background:

linear-gradient(
135deg,
#ffffffee,
#eeeeeeee 55%,
#ffffff
);

clip-path:

polygon(
0 3%,
100% 0,
100% 100%,
0 100%
);
}

/* FOTO */

.photo{
width:235px;

height:285px;

background:

linear-gradient(
135deg,
#eeeeee,
#bbbbbb
);

border:

6px solid #b90000;

border-radius:18px;

margin:auto;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

color:#666;

font-weight:bold;

box-shadow:

0 8px 20px #0005,

0 0 0 5px #ffffff;
}

.photo img{
width:100%;

height:100%;

object-fit:cover;
}

/* DATA SISWA */

.fields{

margin-top:22px;

background:

linear-gradient(
135deg,
#ffffff,
#eeeeee
);

border-radius:15px;

padding:14px 20px;

border-left:

7px solid #b40000;

box-shadow:

0 5px 15px #0003;
}

.row{

display:flex;

border-bottom:

1px solid #d4d4d4;

padding:11px 0;

font-size:17px;

text-align:left;
}

.row:last-child{
border:0;
}

.k{

width:145px;

font-weight:900;

color:#8d0000;
}

.v{

font-weight:bold;

word-break:break-word;
}

/* FOOTER */

.footer{

position:absolute;

z-index:10;

bottom:0;

left:0;

right:0;

background:

linear-gradient(
90deg,
#3d0000,
#b40000,
#4d0000
);

color:white;

padding:16px;

font-weight:bold;

font-size:17px;

letter-spacing:1px;

box-shadow:

0 -5px 15px #0004;
}

/* RESPONSIVE */

@media(max-width:900px){

.wrap{
grid-template-columns:1fr;
}

.preview{
padding:8px;
}

#card{

transform:scale(.62);

transform-origin:top center;

margin-bottom:-320px;

}

}

</style>

</head>

<body>

<header>

<h1>PEMBUATAN KARTU PELAJAR</h1>

<p>Jurusan Teknik Mekatronika</p>

</header>

<div class="wrap">

<div class="panel">

<h2>Isi Biodata</h2>

<label>Nama Lengkap</label>

<input
id="nama"
placeholder="Masukkan nama"

>

<label>NIS</label>

<input
id="nis"
placeholder="Masukkan NIS"

>



<label>Upload Foto</label>

<input
id="foto"
type="file"
accept="image/*"

>

<button
style="background:#b40000;color:white"
onclick="updateCard()"

>

TAMPILKAN KARTU

</button>

<button
style="background:#222;color:white"
onclick="downloadCard()"

>

DOWNLOAD PNG

</button>

<p
style="
font-size:13px;
color:#666
"
>

Data hanya diproses di perangkat dan tidak disimpan ke server.

</p>

</div>

<div class="preview">

<div id="card">

<div class="circuit"></div>

<div class="top">

<div class="logo">
<img src="https://smkintan.github.io/foto/MEKATRONIKA.jpg">
</div>



<div class="school">

SMK NEGERI 1

<br>

INDRALAYA SELATAN

</div>

<div class="dept">

MEKATRONIKA

</div>

<div class="sub">

MEKANIK • ELEKTRONIK • INFORMATIKA

</div>

</div>

<div class="body">

<div
class="photo"
id="photoBox"
>

FOTO SISWA

</div>

<div class="fields">

<div class="row">

<div class="k">

NAMA

</div>

<div
class="v"
id="oNama"
>

*

</div>

</div>

<div class="row">

<div class="k">

NIS

</div>

<div
class="v"
id="oNis"
>

*

</div>

</div>


<div class="row">

<div class="k">

JURUSAN

</div>

<div
class="v"
id="oJurusan"
>

TEKNIK MEKATRONIKA

</div>

</div>


</div>

</div>

<div class="footer">

KREATIF • INOVATIF • BERDAYA SAING

</div>

</div>

</div>

</div>

<script>

/* =========================
UPDATE DATA KARTU
========================= */

function updateCard(){

const nama =
document.getElementById("nama").value.trim();

const nis =
document.getElementById("nis").value.trim();


document.getElementById("oNama").textContent =
nama ? nama.toUpperCase() : "-";


document.getElementById("oNis").textContent =
nis ? nis : "-";

}


/* =========================
UPLOAD FOTO
========================= */

document
.getElementById("foto")
.addEventListener("change", function(event){

const file =
event.target.files[0];

if(!file){
return;
}

const reader =
new FileReader();

reader.onload =
function(e){

const photoBox =
document.getElementById("photoBox");

photoBox.innerHTML = "";

const image =
document.createElement("img");

image.src =
e.target.result;

image.alt =
"Foto Siswa";

image.style.width =
"100%";

image.style.height =
"100%";

image.style.display =
"block";

image.style.objectFit =
"cover";

image.style.objectPosition =
"center";

photoBox.appendChild(image);

};

reader.readAsDataURL(file);

});


/* =========================
DOWNLOAD PNG
========================= */

async function downloadCard(){

try{

/* UPDATE DATA */

updateCard();


/* AMBIL KARTU */

const card =
document.getElementById("card");


/* UBAH TULISAN TOMBOL */

const tombol =
document.querySelector(
'button[onclick="downloadCard()"]'
);

const teksAwal =
tombol.innerHTML;

tombol.innerHTML =
"⏳ MEMPROSES KARTU...";

tombol.disabled =
true;


/* TUNGGU AGAR FOTO SELESAI DIMUAT */

const gambar =
card.querySelectorAll("img");


await Promise.all(

Array.from(gambar).map(

function(img){

if(
img.complete &&
img.naturalWidth > 0
){

return Promise.resolve();

}

return new Promise(

function(resolve){

img.onload =
resolve;

img.onerror =
resolve;

}

);

}

)

);


/* TUNGGU TAMPILAN SELESAI */

await new Promise(

function(resolve){

setTimeout(
resolve,
500
);

}

);


/* BUAT CANVAS */

const canvas =
await html2canvas(

card,

{

scale:2,

backgroundColor:"#ffffff",

useCORS:true,

allowTaint:true,

logging:false,

imageTimeout:20000

}

);


/* BUAT FILE PNG */

const nama =
document
.getElementById("nama")
.value
.trim()

||

"MEKATRONIKA";


const namaFile =
nama

.replace(
/[^a-zA-Z0-9]/g,
"_"
)

.toUpperCase();


const link =
document.createElement("a");


link.download =
"KARTU_PELAJAR_" +
namaFile +
".png";


link.href =
canvas.toDataURL(
"image/png"
);


/* MASUKKAN LINK KE HALAMAN */

document.body.appendChild(
link
);


/* DOWNLOAD */

link.click();


/* HAPUS LINK */

setTimeout(

function(){

document.body.removeChild(
link
);

URL.revokeObjectURL(
link.href
);

},

500

);


/* KEMBALIKAN TOMBOL */

tombol.innerHTML =
teksAwal;

tombol.disabled =
false;

}

catch(error){

console.error(
error
);

alert(

"Gagal membuat kartu. Pastikan foto sudah dipilih, lalu coba kembali."

);

const tombol =
document.querySelector(
'button[onclick="downloadCard()"]'
);

if(tombol){

tombol.innerHTML =
"DOWNLOAD PNG";

tombol.disabled =
false;

}

}

}

</script>

</body>

</html>
